<div class="timer">
    {{ (countdown$ | async)! * 1000 | date:'mm:ss'}}
</div>

<div class="controls-container">
    <button (click)="toggleTimer()" class="button-style" mat-raised-button>
    {{ isRunning ? 'Pause' : ( (countdown$ | async) === this.initialSeconds ? 'Start' : 'Continue' ) }}
    </button>
    <button (click)="reset()" class="button-style" mat-raised-button>
        Restart
    </button>
</div>
